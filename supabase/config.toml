# Configuración mínima del proyecto local de Supabase.
# Ajusta project_id al ref de tu proyecto si vinculas con `supabase link`.
project_id = "aranha-baile"

[db]
port = 54322
major_version = 15

[api]
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]

[studio]
port = 54323

[auth]
enable_signup = true
site_url = "http://localhost:3000"
# El callback del enlace mágico debe estar permitido aquí Y en el proyecto real
# (Supabase Dashboard → Authentication → URL Configuration → Redirect URLs).
additional_redirect_urls = [
  "http://localhost:3000/area-privada",
  "http://localhost:3000/area-privada/callback",
  "https://nexusvng.es/area-privada/callback",
]
